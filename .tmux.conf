# Set the prefix key to Ctrl-a (default is Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Set the base index for windows and panes to 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse mode
set -g mouse on

# Set the default terminal mode to 256-color
set -g default-terminal "screen-256color"

# Split windows using | and -
bind | split-window -h
bind - split-window -v

# Reload the configuration file with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable vim-style copy mode
setw -g mode-keys vi

# Status bar customization
set -g status-interval 5

# Easy pane resizing with arrow keys
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Bind `split-window` and `split-window -h` to retain the current directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# Tmux Pure White Theme (Final Fix)
# ==========================================
# สำคัญ: วางชุดนี้ไว้ล่างสุดของไฟล์ ~/.tmux.conf

# บังคับ reset สีพื้นหลังแถบสถานะให้เป็นสีขาว (White)
set -g status-bg "#ffffff"
set -g status-fg "#2e3436"
set -g status-style "bg=#ffffff,fg=#2e3436"

# ฝั่งซ้าย (Session Name) - พื้นขาว ตัวหนังสือดำ
set -g status-left-style "bg=#ffffff,fg=#2e3436,bold"
set -g status-left " #S "

# ฝั่งขวา (Time) - พื้นขาว
set -g status-right-style "bg=#ffffff,fg=#2e3436"
set -g status-right " %H:%M %d-%b-%y "

# หน้าต่างที่เลือกอยู่ (Active) - ตัวหนังสือสีส้ม พื้นขาว
set -g window-status-current-style "bg=#ffffff,fg=#ce5c00,bold"
set -g window-status-current-format " #I:#W "

# หน้าต่างที่ไม่ได้เลือก (Inactive) - ตัวหนังสือสีเทา พื้นขาว
set -g window-status-style "bg=#ffffff,fg=#888a85"
set -g window-status-format " #I:#W "

# เส้นขอบ
set -g pane-border-style "fg=#d3d7cf"
set -g pane-active-border-style "fg=#ce5c00"
